name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_VERSION: "2.5.0"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Testlar yig'ishni to'xtatadi: baza WAL rejimiga o'tkazildi va Windows'da
      # yozish ishlaydi, shuning uchun regressiya bo'lsa darhol bilinadi.
      - name: Testlar
        shell: bash
        run: ./gradlew :shared:jvmTest --console=plain

      - name: Test hisoboti
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          if-no-files-found: warn
          path: |
            shared/build/reports/tests/jvmTest
            shared/build/test-results/jvmTest

      - name: MSI installer
        continue-on-error: true
        shell: bash
        run: ./gradlew :desktopApp:packageMsi --console=plain --stacktrace

      - name: EXE installer
        continue-on-error: true
        shell: bash
        run: ./gradlew :desktopApp:packageExe --console=plain --stacktrace

      - name: Portable app image
        shell: bash
        run: ./gradlew :desktopApp:createDistributable --console=plain

      - name: Zip portable app
        shell: bash
        run: |
          cd desktopApp/build/compose/binaries/main/app
          7z a "$GITHUB_WORKSPACE/BilliardClubManager-$APP_VERSION-windows-x64.zip" BilliardClubManager

      - name: Show build outputs
        shell: bash
        run: |
          find desktopApp/build/compose/binaries -maxdepth 4 -type f \( -name "*.msi" -o -name "*.exe" \) -print
          ls -lh "$GITHUB_WORKSPACE"/*.zip || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          if-no-files-found: warn
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            BilliardClubManager-${{ env.APP_VERSION }}-windows-x64.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.APP_VERSION) }}
          fail_on_unmatched_files: false
          files: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            BilliardClubManager-${{ env.APP_VERSION }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
