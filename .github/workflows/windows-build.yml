name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testlar
        continue-on-error: true
        shell: bash
        run: ./gradlew :shared:jvmTest --console=plain

      - name: Test hisoboti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          if-no-files-found: warn
          path: |
            shared/build/reports/tests/jvmTest
            shared/build/test-results/jvmTest

      - name: Build MSI installer
        id: msi
        continue-on-error: true
        shell: bash
        run: ./gradlew :desktopApp:packageMsi --console=plain --stacktrace

      - name: Build portable app image
        shell: bash
        run: ./gradlew :desktopApp:createDistributable --console=plain

      - name: Zip portable app
        shell: bash
        run: |
          cd desktopApp/build/compose/binaries/main/app
          7z a "$GITHUB_WORKSPACE/BilliardClubManager-2.5.0-windows-x64.zip" BilliardClubManager

      - name: Show build outputs
        shell: bash
        run: |
          find desktopApp/build/compose/binaries -maxdepth 4 -type f \( -name "*.msi" -o -name "*.exe" \) -print
          ls -lh "$GITHUB_WORKSPACE"/*.zip || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          if-no-files-found: warn
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            BilliardClubManager-2.5.0-windows-x64.zip

      - name: Attach to release v2.5.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          fail_on_unmatched_files: false
          files: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            BilliardClubManager-2.5.0-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
